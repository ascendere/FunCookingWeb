<!DOCTYPE html>
<html>
<head>
    <title>Test de Autenticación</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
</head>
<body>
    <h1>Test de Autenticación Firebase</h1>
    <button onclick="testLogin()">Probar Login</button>
    <div id="result"></div>

    <script>
        // Configuración de Firebase (usar la misma del proyecto)
        const firebaseConfig = {
            apiKey: "AIzaSyC8Q7PO3aF4rGRJsrLQVFkQEBw36qOiDJg",
            authDomain: "funcooking2-72cbd.firebaseapp.com",
            projectId: "funcooking2-72cbd",
            storageBucket: "funcooking2-72cbd.appspot.com",
            messagingSenderId: "334134644084",
            appId: "1:334134644084:web:d12c28d5f84e2b6bbef5b0"
        };

        firebase.initializeApp(firebaseConfig);

        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Iniciando prueba...';

            try {
                // Crear proveedor de Google
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.addScope('email');
                provider.addScope('profile');

                // Hacer login
                console.log('🔄 Iniciando login con Google...');
                const credential = await firebase.auth().signInWithPopup(provider);
                console.log('✅ Login exitoso:', credential.user.email);

                // Obtener token
                const idToken = await credential.user.getIdToken(true);
                console.log('✅ Token obtenido');

                // Probar la función HTTP
                console.log('🔄 Probando función HTTP...');
                const response = await fetch('https://us-central1-funcooking2-72cbd.cloudfunctions.net/verifyFirebaseAuth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: idToken,
                        email: credential.user.email
                    })
                });

                console.log('📡 Status:', response.status);
                
                if (response.status === 200) {
                    resultDiv.innerHTML = '✅ SUCCESS: Autenticación verificada correctamente!';
                    console.log('✅ SUCCESS: Función HTTP funcionó correctamente');
                } else {
                    const errorText = await response.text();
                    resultDiv.innerHTML = `❌ ERROR: Status ${response.status} - ${errorText}`;
                    console.error('❌ ERROR:', response.status, errorText);
                }

            } catch (error) {
                console.error('❌ Error en la prueba:', error);
                resultDiv.innerHTML = `❌ ERROR: ${error.message}`;
            }
        }
    </script>
</body>
</html>
